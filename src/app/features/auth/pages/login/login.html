<section class="min-h-screen bg-slate-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-slate-900">
        Gym System
      </h1>
      <p class="mt-2 text-sm text-slate-500">
        Inicia sesión para administrar el sistema
      </p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700">
          Email
        </label>

        <input
          type="email"
          formControlName="email"
          class="mt-1 w-full rounded-lg border border-slate-300 px-4 py-2 outline-none focus:border-slate-900"
          placeholder="admin@gym.com"
        />

        <p
          *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid"
          class="mt-1 text-sm text-red-600"
        >
          Ingresa un email válido.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">
          Contraseña
        </label>

        <input
          type="password"
          formControlName="password"
          class="mt-1 w-full rounded-lg border border-slate-300 px-4 py-2 outline-none focus:border-slate-900"
          placeholder="••••••••"
        />

        <p
          *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid"
          class="mt-1 text-sm text-red-600"
        >
          La contraseña es obligatoria.
        </p>
      </div>

      <p *ngIf="errorMessage" class="rounded-lg bg-red-50 px-4 py-2 text-sm text-red-700">
        {{ errorMessage }}
      </p>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full rounded-lg bg-slate-900 px-4 py-2 font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</section>
