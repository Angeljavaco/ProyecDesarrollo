<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 shadow space-y-5"
>
  <div>
    <h2 class="text-lg font-semibold text-white">
      Asignar rol a usuario
    </h2>
    <p class="text-sm text-slate-400">
      Selecciona un usuario y asígnale un rol del sistema.
    </p>
  </div>

  @if (isLoading) {
    <div class="rounded-xl border border-slate-800 bg-slate-950 p-4 text-slate-300">
      Cargando usuarios y roles...
    </div>
  }

  @if (successMessage) {
    <div class="rounded-xl border border-emerald-900 bg-emerald-950/40 p-4 text-emerald-300">
      {{ successMessage }}
    </div>
  }

  @if (errorMessage) {
    <div class="rounded-xl border border-red-900 bg-red-950/40 p-4 text-red-300">
      {{ errorMessage }}
    </div>
  }

  <div class="grid gap-4 md:grid-cols-2">
    <div>
      <label class="mb-2 block text-sm font-medium text-slate-300">
        Usuario
      </label>

      <select
        formControlName="idUsuario"
        class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-indigo-500"
      >
        <option [value]="0">Seleccione un usuario</option>

        @for (usuario of usuarios; track usuario.id) {
          <option [value]="usuario.id">
            {{ usuario.nombre }} - {{ usuario.email }}
          </option>
        }
      </select>
    </div>

    <div>
      <label class="mb-2 block text-sm font-medium text-slate-300">
        Rol
      </label>

      <select
        formControlName="idRol"
        class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-indigo-500"
      >
        <option [value]="0">Seleccione un rol</option>

        @for (rol of roles; track rol.id) {
          <option [value]="rol.id">
            {{ rol.nombre }}
          </option>
        }
      </select>
    </div>
  </div>

  <button
    type="submit"
    class="rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white hover:bg-indigo-500"
  >
    Asignar rol
  </button>
</form>
