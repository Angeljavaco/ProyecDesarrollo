<form [formGroup]="form" (ngSubmit)="onSubmit()" class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6 shadow space-y-4">
  <h2 class="text-lg font-semibold text-white">Crear usuario</h2>

  <div class="grid gap-4 md:grid-cols-2">
    <input class="rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none placeholder:text-slate-500 focus:border-indigo-500" placeholder="Nombre" formControlName="nombre" />

    <input class="rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none placeholder:text-slate-500 focus:border-indigo-500" placeholder="Email" formControlName="email" />

    <input class="rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none placeholder:text-slate-500 focus:border-indigo-500" placeholder="Password" type="password" formControlName="password" />

    <input class="rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none placeholder:text-slate-500 focus:border-indigo-500" placeholder="Teléfono" formControlName="telefono" />
  </div>

  <button class="rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white hover:bg-indigo-500">
    Guardar usuario
  </button>
</form>
